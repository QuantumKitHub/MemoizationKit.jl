name: Documentation

on:
  push:
    branches:
      - 'main'
    tags: '*'
  pull_request:
  workflow_dispatch:

# Documenter deploys to gh-pages with GITHUB_TOKEN, which is read-only by default.
permissions:
  contents: write
  statuses: write
  pull-requests: write

jobs:
  Documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For authentication with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # For authentication with SSH deploy key
        run: julia --project=docs/ docs/make.jl
      - name: Comment with documentation preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- memoizationkit-docs-preview -->';
            const issue_number = context.issue.number;
            const url = `https://lkdvos.github.io/MemoizationKit.jl/previews/PR${issue_number}/`;
            const body = `${marker}\n[Preview the documentation](${url})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
            });
            const comment = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body?.includes(marker)
            );
            if (comment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: comment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body,
              });
            }
