name: CI

on:
  push:
    branches:
      - 'main'
    tags: '*'
    paths-ignore:
      - 'docs/**'
      - 'research/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  # `test/` is flat (ParallelTestRunner parallelizes across `test_*.jl` itself), so use the plain
  # `Tests` reusable workflow rather than `TestGroups`, with the version/OS matrix expanded here.
  tests:
    name: "Tests"
    strategy:
      fail-fast: false
      matrix:
        version: ["min", "1"]
        # macOS and Windows only run on pushes to the default branch and manual runs...
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        # ...and only with the latest Julia version
        exclude:
          - {version: 'min', os: macos-latest}
          - {version: 'min', os: windows-latest}
    uses: "QuantumKitHub/QuantumKitHubActions/.github/workflows/Tests.yml@main"
    with:
      julia-version: "${{ matrix.version }}"
      os: "${{ matrix.os }}"
      # Caches must be exercised under contention, so always run multithreaded.
      nthreads: 2
      coverage: ${{ matrix.os == 'ubuntu-latest' && matrix.version == '1' }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Single aggregate check for branch protection, not reported for runs triggered by closing a PR
  # (these only exist to cancel in-progress runs, and skip all tests).
  ci-success:
    name: "ci-success"
    needs: tests
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: "Check that all test jobs succeeded"
        if: needs.tests.result != 'success'
        run: |
          echo "Test matrix result: ${{ needs.tests.result }}"
          exit 1
      - run: echo "All test jobs succeeded."
